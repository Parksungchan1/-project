<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 모니터</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 20px auto; padding: 0 12px; background: #f7f7f7; }
  h1 { font-size: 20px; }
  .status { font-size: 13px; color: #555; }
  input { width: 100%; padding: 10px; margin: 6px 0 16px; box-sizing: border-box; font-size: 14px; }

  #connBar { padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-bottom: 16px; }
  #connBar.ok { background: #dcfce7; color: #166534; }
  #connBar.bad { background: #fee2e2; color: #991b1b; }
  #connBar.unknown { background: #f3f4f6; color: #555; }

  #current { border-radius: 12px; padding: 20px; margin-bottom: 16px; background: #fff; border: 2px solid #ddd; }
  #current.printing { border-color: #2563eb; background: #eff6ff; }
  #current .label { font-size: 13px; color: #888; }
  #current .artist { font-size: 30px; font-weight: bold; margin: 6px 0; }
  #current .sub { font-size: 15px; color: #444; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 13px; }
  .pending { background: #fef3c7; color: #92400e; }
  .in_progress { background: #dbeafe; color: #1e40af; }
  .completed { background: #dcfce7; color: #166534; }
  .failed { background: #fee2e2; color: #991b1b; }
  .retryBtn { padding: 6px 12px; border: none; border-radius: 6px; background: #991b1b; color: #fff; font-size: 13px; cursor: pointer; }
  .testBtn { padding: 10px 14px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; margin-bottom: 16px; }
  .testBtn:disabled { background: #93c5fd; cursor: default; }
</style>
</head>
<body>
  <h1>관리자 모니터</h1>
  <p class="status">
    사용자가 출력요청을 보내면 자동으로 여기 나타나고, 자동으로 출력됩니다.
    이 페이지는 상태만 보여주며, 실패한 작업의 "다시 시도" 버튼 외에는 아무것도 직접 트리거하지 않습니다.
  </p>
  <input id="adminToken" placeholder="ADMIN_TOKEN 입력 (.env와 동일하게)" />

  <div id="connBar" class="unknown">프린터 연결 프로그램 상태 확인 중...</div>

  <button class="testBtn" id="testPrintBtn" onclick="testPrint()">🖨 테스트 인쇄 ("안녕")</button>

  <div id="current">
    <div class="label">최근 요청</div>
    <div class="artist" id="currentArtist">대기 중...</div>
    <div class="sub" id="currentStatus"></div>
  </div>

  <table>
    <thead><tr><th>시간</th><th>아티스트</th><th>상태</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const statusLabel = { pending: "대기중", in_progress: "출력중", completed: "출력완료", failed: "실패" };

  // Booth device can just bookmark /admin.html?token=... once and never type it again.
  const urlToken = new URLSearchParams(location.search).get('token');
  if (urlToken) {
    localStorage.setItem('adminToken', urlToken);
    document.getElementById('adminToken').style.display = 'none';
  }

  function getToken() {
    const input = document.getElementById('adminToken');
    const stored = localStorage.getItem('adminToken');
    if (stored && !input.value) input.value = stored;
    if (input.value) localStorage.setItem('adminToken', input.value);
    return input.value;
  }

  function setConnBar(adminClientLastSeen) {
    const bar = document.getElementById('connBar');
    if (!adminClientLastSeen) {
      bar.className = 'unknown';
      bar.textContent = '프린터 연결 프로그램(admin-client)이 아직 한 번도 접속하지 않았습니다. 랩탑에서 admin-client를 실행했는지 확인하세요.';
      return;
    }
    const secondsAgo = (Date.now() - new Date(adminClientLastSeen).getTime()) / 1000;
    if (secondsAgo < 5) {
      bar.className = 'ok';
      bar.textContent = `프린터 연결 프로그램 정상 작동 중 (${secondsAgo.toFixed(0)}초 전 확인)`;
    } else {
      bar.className = 'bad';
      bar.textContent = `연결 끊김 — ${Math.floor(secondsAgo)}초 동안 응답 없음. 랩탑의 admin-client 프로그램/블루투스 연결을 확인하세요.`;
    }
  }

  async function retry(jobId) {
    const token = getToken();
    await fetch(`/api/print-jobs/${jobId}/retry`, { method: 'POST', headers: { 'x-admin-token': token } });
    refresh();
  }
  window.retry = retry;

  async function testPrint() {
    const token = getToken();
    const btn = document.getElementById('testPrintBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/print-jobs/test-print', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify({ text: '안녕' }),
      });
      if (!res.ok) alert(`테스트 인쇄 요청 실패 (${res.status})`);
      refresh();
    } finally {
      btn.disabled = false;
    }
  }
  window.testPrint = testPrint;

  async function refresh() {
    const token = getToken();
    if (!token) return;
    const res = await fetch('/api/print-jobs', { headers: { 'x-admin-token': token } });
    if (!res.ok) {
      document.getElementById('currentArtist').textContent = res.status === 401 ? '토큰이 틀렸습니다' : `오류 (${res.status})`;
      document.getElementById('currentStatus').textContent = '';
      return;
    }
    const { jobs, adminClientLastSeen } = await res.json();
    setConnBar(adminClientLastSeen);

    const currentBox = document.getElementById('current');
    const currentArtist = document.getElementById('currentArtist');
    const currentStatus = document.getElementById('currentStatus');
    if (jobs.length > 0) {
      const latest = jobs[0];
      currentArtist.textContent = latest.artistName;
      currentStatus.textContent = `${statusLabel[latest.status]} · ${new Date(latest.updatedAt).toLocaleTimeString()}`;
      currentBox.className = latest.status === 'in_progress' ? 'printing' : '';
    } else {
      currentArtist.textContent = '대기 중...';
      currentStatus.textContent = '';
      currentBox.className = '';
    }

    const rows = document.getElementById('rows');
    rows.innerHTML = jobs.map((job) => `
      <tr>
        <td>${new Date(job.createdAt).toLocaleTimeString()}</td>
        <td>${job.artistName}</td>
        <td><span class="badge ${job.status}">${statusLabel[job.status]}</span></td>
        <td>${job.status === 'failed' ? `<button class="retryBtn" onclick="retry('${job.id}')">다시 시도</button>` : ''}</td>
      </tr>
    `).join('');
  }

  document.getElementById('adminToken').addEventListener('input', refresh);
  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>
